plugins {
    id 'base'
}

def pythonVenvDirName = "venv"
def pythonVenvDir = "$projectDir/$pythonVenvDirName"
def yamlExtension = ".yaml"
def jsonExtension = ".json"
def pythonExtension = ".py"
def markdownExtension = ".md"
def unifiedSchemaFileName = "unifiedSchema"
def unifiedSchemaSrcDirPath = "$projectDir/packages/initial-boundary-value-problem-schema"
def unifiedSchemaBuildPath = "$buildDir/$unifiedSchemaFileName$yamlExtension"
def modelDirName = "model"
def modelEquationsDirName = "$modelDirName/equations"
def modelEquationsSrcDir = "$projectDir/$modelEquationsDirName"
def modelEquationsBuildDir = "$buildDir/$modelEquationsDirName"
def modelExamplesDirName = "$modelDirName/examples"
def modelExamplesSrcDir = "$projectDir/$modelExamplesDirName"
def modelExamplesBuildDir = "$buildDir/$modelExamplesDirName"
def importsMergerTemplateFileName = "merge_imports.py.njk"
def solveForEquationsTemplateFileName = "solve_for_equations.py.njk"
def analyticalModelTemplateFileName = "run_analysis.py.njk"
def viewsDirName = "views"
def queryDirName = "$viewsDirName/queries"
def mergedImportsModelBuildDir = "$buildDir/$queryDirName/mergedImports"
def solvedEquationsModelBuildDir = "$buildDir/$queryDirName/solvedEquations"
def analyticalModelBuildDirName = "analysis"
def analyticalModelBuildDir = "$buildDir/$queryDirName/$analyticalModelBuildDirName"
def querySrcDir = "$projectDir/$queryDirName"
def resultsBuildDirName = "$analyticalModelBuildDirName/results"
def resultsBuildDir = "$buildDir/$queryDirName/$resultsBuildDirName"
def reportTemplateFileName = "analysis_report.md.njk"
def reportTemplateDir = "$projectDir/$viewsDirName"
def reportTemplatePath = "$reportTemplateDir/$reportTemplateFileName"
def reportBuildDirName = "$viewsDirName/reports"
def reportBuildDir = "$buildDir/$reportBuildDirName"

tasks.register('createPythonVenv') {
    inputs.files(fileTree("$projectDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$pythonVenvDir"))
    exec {
         commandLine "python", "-m", "venv", "$pythonVenvDirName"
    }
}

tasks.register('installPythonDependencies') {
    dependsOn(createPythonVenv)
    inputs.files(fileTree("$projectDir/requirements.txt"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$pythonVenvDir"))
    exec {
         commandLine "$projectDir/venv/bin/python", "$projectDir/venv/bin/pip", "install", "-r", "$projectDir/requirements.txt"
    }
}

tasks.register('loadUnifiedSchemaAsYaml', Exec) {
    inputs.files(fileTree("$unifiedSchemaSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "npm exec -- yds-load $unifiedSchemaSrcDirPath > $unifiedSchemaBuildPath"
}

tasks.register('buildUnifiedSchema', Exec) {
//    dependsOn(loadUnifiedSchema)
    dependsOn(loadUnifiedSchemaAsYaml)
    inputs.files(fileTree("$unifiedSchemaBuildPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "gen-yaml $unifiedSchemaBuildPath --mergeimports"
}

tasks.register('cleanupUnifiedSchema', Exec) {
    dependsOn(buildUnifiedSchema)
    inputs.files(fileTree("$unifiedSchemaBuildPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "yq", "-i", "del(.imports)", "$unifiedSchemaBuildPath"
}

tasks.register('loadModelExamples') {
    dependsOn(cleanupUnifiedSchema)
    inputs.files(fileTree("$modelExamplesSrcDir"))
    .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$modelExamplesBuildDir"))
    doLast {
        new File("$modelExamplesSrcDir").eachDir { methodDir ->
            new File("$methodDir").eachDir { exampleDir -> 
                exec {
                    commandLine "bash", "-c", "mkdir $modelExamplesBuildDir/$exampleDir.name && npm exec -- yds-load $methodDir/$exampleDir.name > $modelExamplesBuildDir/$exampleDir.name/_this.yaml"
                }
            }
        }
    }
}

tasks.register('validateModelExamples') {
    dependsOn(loadModelExamples)
    inputs.files(fileTree("$modelExamplesBuildDir"))
    .withPathSensitivity(PathSensitivity.ABSOLUTE)
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "linkml-validate", "-s", "$unifiedSchemaBuildPath", "--target-class", "InitialBoundaryValueProblem", "$exampleDir/_this.yaml"
            }
        }
    }
}

tasks.register('buildImportsMerger') {
    dependsOn(validateModelExamples)
    inputs.files(fileTree("$modelExamplesBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$mergedImportsModelBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "npm exec -- nunjucks -d $exampleDir/_this.yaml $querySrcDir/$importsMergerTemplateFileName > $mergedImportsModelBuildDir/$exampleDir.name$pythonExtension"
            }
        }
    }
}

tasks.register('buildModelExamplesWithMergedImports') {
    dependsOn(buildImportsMerger)
    inputs.files(fileTree("$mergedImportsModelBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$mergedImportsModelBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "./venv/bin/python $mergedImportsModelBuildDir/$exampleDir.name$pythonExtension > $mergedImportsModelBuildDir/$exampleDir.name$yamlExtension"
            }
        }
    }
}

tasks.register('buildEquationsSolver') {
    dependsOn(buildModelExamplesWithMergedImports)
    inputs.files(fileTree("$mergedImportsModelBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$solvedEquationsModelBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "npm exec -- nunjucks -d $mergedImportsModelBuildDir/$exampleDir.name$yamlExtension $querySrcDir/$solveForEquationsTemplateFileName > $solvedEquationsModelBuildDir/$exampleDir.name$pythonExtension"
            }
        }
    }
}

tasks.register('buildModelExamplesWithSolvedEquations') {
    dependsOn(buildEquationsSolver)
    inputs.files(fileTree("$solvedEquationsModelBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$solvedEquationsModelBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "./venv/bin/python $solvedEquationsModelBuildDir/$exampleDir.name$pythonExtension > $solvedEquationsModelBuildDir/$exampleDir.name$yamlExtension"
            }
        }
    }
}

tasks.register('buildAnalyticalModelExamples') {
    dependsOn(buildModelExamplesWithSolvedEquations)
    inputs.files(fileTree("$modelExamplesBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$resultsBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "npm exec -- nunjucks -d $solvedEquationsModelBuildDir/$exampleDir.name$yamlExtension $querySrcDir/$analyticalModelTemplateFileName > $analyticalModelBuildDir/$exampleDir.name$pythonExtension"
            }
        }
    }
}

tasks.register('generateAnalysisResults') {
    dependsOn(buildAnalyticalModelExamples)
    inputs.files(fileTree("$resultsBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$resultsBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "./venv/bin/python $analyticalModelBuildDir/$exampleDir.name$pythonExtension > $resultsBuildDir/$exampleDir.name$jsonExtension"
            }
        }
    }
}

tasks.register('generateReport') {
    dependsOn(generateAnalysisResults)
    inputs.files(fileTree("$resultsBuildDir"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$reportBuildDir"))
    doLast {
        new File("$modelExamplesBuildDir").eachDir { exampleDir ->
            exec {
                commandLine "bash", "-c", "npm exec -- nunjucks -d $resultsBuildDir/$exampleDir.name$jsonExtension $reportTemplatePath > $reportBuildDir/$exampleDir.name$markdownExtension && cat $reportBuildDir/$exampleDir.name$markdownExtension"
            }
        }
    }
}

tasks.named("assemble") {
    dependsOn(generateReport)
}

